name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Diagnostics
        run: |
          node -v
          npm -v
          echo "OIDC URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "OIDC TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          npm config get registry

      - name: Publish
        run: npm publish --provenance --access public --loglevel verbose